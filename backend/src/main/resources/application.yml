server:
  port: 8088

spring:
  application:
    name: teacher-workplatform
  datasource:
    # 默认/正式库配置 (master: teacher_workspace)
    url: jdbc:mysql://localhost:3306/teacher_workspace?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    master:
      jdbc-url: ${MASTER_DB_URL:jdbc:mysql://localhost:3306/teacher_workspace?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      username: ${MASTER_DB_USER:root}
      password: ${MASTER_DB_PWD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立测试沙箱库配置 (demo: teacher_workspace_demo)
    demo:
      jdbc-url: ${DEMO_DB_URL:jdbc:mysql://localhost:3306/teacher_workspace_demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      username: ${DEMO_DB_USER:root}
      password: ${DEMO_DB_PWD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    # 生产部署必须用环境变量 APP_JWT_SECRET 注入随机长串（≥32 字节）；
    # 未注入时仅用开发默认值（已入库，视为公开密钥，任何人都能伪造 token）。
    secret: ${APP_JWT_SECRET:dev-insecure-secret-do-not-use-in-prod-0123456789abcdef}
    expire-hours: ${APP_JWT_EXPIRE_HOURS:24}
  # 仅当部署在可信反向代理（Nginx 等）之后才置 true：此时从代理头取客户端 IP；
  # 直连部署保持 false，防止客户端伪造 X-Forwarded-For 绕过登录失败计数与锁定。
  trust-proxy: ${TRUST_PROXY:false}
  # 本地上传目录（自定义宠物皮肤图片）；经 /uploads/** 静态映射访问，部署时可用 UPLOAD_DIR 覆盖
  upload-dir: ${UPLOAD_DIR:./uploads}
  pet:
    # 开发/E2E 开关：true 时 /pet/hatch-seen 允许 force 立即破壳（免等跨天，自动化测试用）；生产必须 false 或不配
    dev-hatch: ${PET_DEV_HATCH:false}

ai:
  defaults:
    # 默认 LLM 服务（newapi 渠道，OpenAI 兼容协议；base-url 不带 /vN 时 AiService 自动补 /v1）
    # 部署时可用环境变量 AI_API_KEY / AI_BASE_URL / AI_MODEL 覆盖（换 key/换服务无需改代码）
    base-url: ${AI_BASE_URL:https://chunfeng.mentalout.top}
    api-key: ${AI_API_KEY:sk-leDPv7wCWbL9uSk0Nvy0bJ2lFYHy74k1GnCcfxZzkWDhvmme}
    model: ${AI_MODEL:gpt-5.4-mini}
    temperature: 0.7
    timeout-ms: 60000

logging:
  level:
    com.teacher.platform: info

# ============================================================
# [正式域] teacher.novastarhub.cn — 班主任工作平台（生产环境）
# ============================================================
server {
    listen 80;
    server_name teacher.novastarhub.cn;

    client_max_body_size 20m;
    root /opt/teacher_workspace/dist;
    index index.html;

    # Certbot ACME 证书签发验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 后端 API 反代（Host 头携带 teacher.novastarhub.cn，后端默认切 master 生产库）
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 本地上传文件反代
    location /uploads/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大屏路由映射
    location = /boss { try_files /index.html =404; }
    location = /boss/ { try_files /index.html =404; }
    location = /radish { try_files /index.html =404; }
    location = /radish/ { try_files /index.html =404; }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

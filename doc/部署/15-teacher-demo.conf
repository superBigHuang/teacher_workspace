# ============================================================
# [子域] teacher-demo.novastarhub.cn — 班主任工作平台（测试/演示沙箱）
# ============================================================

# ---------- 80：跳转 HTTPS ----------
server {
    listen 80;
    server_name teacher-demo.novastarhub.cn;

    # Certbot ACME 证书签发验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：HTTPS 测试/演示沙箱 ----------
server {
    listen 443 ssl;
    server_name teacher-demo.novastarhub.cn;

    ssl_certificate     /etc/letsencrypt/live/teacher-demo.novastarhub.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacher-demo.novastarhub.cn/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;
    root /opt/teacher_workspace/dist;
    index index.html;

    # 后端 API 反代（Host 头携带 teacher-demo.novastarhub.cn，后端自动切 demo 库）
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 本地上传文件反代
    location /uploads/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 大屏路由映射
    location = /boss { try_files /index.html =404; }
    location = /boss/ { try_files /index.html =404; }
    location = /radish { try_files /index.html =404; }
    location = /radish/ { try_files /index.html =404; }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
